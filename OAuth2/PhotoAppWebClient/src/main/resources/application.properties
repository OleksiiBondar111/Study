spring.application.name=PhotoAppWebClient
server.port=8087
spring.security.oauth2.client.registration.mywebclient.client-id=photo-app-webclient
spring.security.oauth2.client.registration.mywebclient.client-secret=ClNXpped1csW9DnuLs77MIsbuNdmZYyO
spring.security.oauth2.client.registration.mywebclient.scope=openid, profile, roles
spring.security.oauth2.client.registration.mywebclient.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.mywebclient.redirect-uri=http://localhost:8087/login/oauth2/code/myweblcient

spring.security.oauth2.client.provider.mywebclient.authorization-uri = http://localhost:8080/realms/photoapp/protocol/openid-connect/auth
